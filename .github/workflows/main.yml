name: Build LeaderboardPlugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Imposta JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build con Maven
        run: mvn package -q

      - name: Upload artifact (scarica il jar)
        uses: actions/upload-artifact@v4
        with:
          name: LeaderboardPlugin
          path: target/LeaderboardPlugin-1.0.0.jar
